<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <!-- TÍTULO DE LA PÁGINA (lo que aparece en la pestaña del navegador) -->
  <title>Gerson Store</title>

  <!--Link para agregar Boostrap 5 al proyecto-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>

      <!-- BUSCADOR -->

        <input type="text" placeholder="¿Qué estás buscando?">
      </div>

      <!-- ICONOS DERECHA -->
      <div class="icons">
        <span>Mi Cuenta</span>
        <span>Carrito</span>
      </div>

    </div>

<!-- ==========================================
                MENÚ PRINCIPAL
========================================== -->

    <div>
      <nav class="navbar navbar-expand-lg bg-body-tertiary ">
        <div class="container-fluid">

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">

              </li>
              <li class="nav-item">

              </li>
              <li class="nav-item">
                <a class="nav-link" href="pages/camisetas.html">Camisetas</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="pages/devolucion.html">Devolución</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="pages/mayorista.html">Mayoristas</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

    </div>

    <section class="hero">

      <h2>Estilo Argentino</h2>
      <h1>Camisetas de Fútbol Para Hombre</h1>

    </section>

   


    <section class="carousel-home">

    </section>



    <!-- ==========================================
                BIENVENIDA
    =========================================== -->

    <section class="bienvenida container">

        <h2>Bienvenidos a GERSON</h2>

        <p>

            Somos una tienda dedicada a la venta de

        </p>

  <!-- ================= FOOTER ================= -->

  <footer>

    <p>

        © 2026 GERSON ARGENTINA

    </p>

</footer>
  <!--Script con funcionalidades para no necesitar javascript,
 siempre va antes del cierre del body por si es pesado
  no joda el resto del proyecto-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
